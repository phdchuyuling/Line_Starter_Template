[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "line-sticker-tool"
version = "0.1.0"
description = "Automated LINE sticker cropping, validation, and packaging tool (CLI + Web)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
rembg = ["rembg>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
line-sticker-tool = "line_sticker_tool.__main__:main"

[project.urls]
Repository = "https://github.com/phdchuyuling/Line_Starter_Template"

[tool.setuptools.packages.find]
where = ["."]
include = ["line_sticker_tool*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
